[project]
name = "crop-labeller"
version = "0.2.1"
description = "Local web app for reviewing and correcting crop labels from NDVI time-series CSV data."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.scripts]
crop-labeller = "crop_labeller.launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crop_labeller"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
